name: CI
on: [ push, pull_request ]
jobs:
  build_browsers:

    permissions:
      contents: read
      id-token: write  # mint GitHub OIDC token for Vault JWT auth
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        browser: [ Firefox, ChromeHeadless ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Setup project
      uses: bpmn-io/actions/setup@latest
    - name: Build (with coverage)
      if: matrix.browser == 'ChromeHeadless'
      env:
        COVERAGE: 1
        TEST_BROWSERS: ${{ matrix.browser }}
      run: npm run all
    - name: Build
      if: matrix.browser == 'Firefox'
      env:
        TEST_BROWSERS: ${{ matrix.browser }}
      run: xvfb-run npm run all
    - name: Import Secrets
      if: matrix.browser == 'ChromeHeadless'
      id: secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: jwt
        role: ${{ secrets.VAULT_JWT_ROLE }}
        path: ${{ secrets.VAULT_JWT_PATH }}
        jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
        exportEnv: false
        secrets: |
          secret/data/products/desktop-modeler/camunda/camunda-bpmn-js CODECOV_TOKEN;
    - name: Upload coverage
      if: matrix.browser == 'ChromeHeadless'
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ steps.secrets.outputs.CODECOV_TOKEN }}

  build_os:

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
        browser: [ ChromeHeadless ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Setup project
      uses: bpmn-io/actions/setup@latest
    - name: Build
      env:
        TEST_BROWSERS: ${{ matrix.browser }}
      run: npm run all
